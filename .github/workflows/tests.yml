name: tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test (empty Hermes home)
        shell: bash
        run: |
          export HERMES_HOME="$RUNNER_TEMP/hermes-home"
          mkdir -p "$HERMES_HOME"
          python -c "import hermes_inbox as h; print(h.file_card('CI smoke card', sender='CI')); print(h.remove_card('filed:CI-CI-smoke-card'))"
